server:
  port: 8091

spring:
  datasource:
    url: jdbc:h2:mem:url_shortener
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dXJsc2hvcnRlbmVyc2VjcmV0a2V5Zm9yand0dG9rZW5nZW5lcmF0aW9uMTIzNDU2Nzg5MA==}
    expiration: 86400000
  base-url: ${APP_BASE_URL:http://localhost:4211}
  seed:
    username: ${SEED_USERNAME:admin}
    password: ${SEED_PASSWORD:admin123}
    email: ${SEED_EMAIL:admin@urlshortener.com}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
